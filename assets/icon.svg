<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4313"/>
      <stop offset="100%" stop-color="#2A5C1F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Background - Full bleed to prevent white corners on PWA splash -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Cow Icon Centerpiece -->
  <g filter="url(#shadow)">
    <text x="256" y="270" font-size="180" text-anchor="middle" dominant-baseline="middle">🐄</text>
  </g>

  <!-- Pulse / Health Waveform -->
  <g transform="translate(106, 330)">
    <rect width="300" height="60" rx="30" fill="rgba(0,0,0,0.25)"/>
    <path d="M 25 30 L 75 30 L 95 12 L 120 48 L 145 18 L 165 38 L 180 30 L 275 30" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <circle cx="275" cy="30" r="5" fill="#FCD34D"/>
  </g>

  <!-- App Title Label -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Segoe UI', sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    MOOTRACKER
  </text>
</svg>
