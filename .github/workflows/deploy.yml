name: Deploy MastiGuard AI to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies & build mobile app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          FIGMA_PUBLIC_URL: /${{ github.event.repository.name }}/app
        run: |
          cd mobile-app
          npm ci
          npm run build
          cd ..

      - name: Prepare GitHub Pages output
        run: |
          mkdir -p dist-pages/app
          cp index.html dist-pages/index.html
          cp mobile.html dist-pages/mobile.html
          cp style.css dist-pages/ 2>/dev/null || true
          cp -r assets dist-pages/ 2>/dev/null || true
          cp -r mobile-app/dist/. dist-pages/app/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist-pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
